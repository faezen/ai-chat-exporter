name: Build, Sign and Release Extension

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare distribution folder
        run: |
          mkdir dist
          cp manifest.json background.js popup.html popup.js dist/
          cp -r icons dist/
          mkdir -p dist/src/content_scripts
          mkdir -p dist/src/lib
          cp src/content_scripts/gemini.js dist/src/content_scripts/
          cp src/content_scripts/chatgpt.js dist/src/content_scripts/
          cp src/content_scripts/aistudio.js dist/src/content_scripts/
          cp src/lib/turndown.js dist/src/lib/

      - name: Zip extension
        run: |
          cd dist
          zip -r ../ai-chat-exporter.zip .
          cd ..

      - name: Build CRX (Chromium)
        if: ${{ secrets.CRX_PRIVATE_KEY != '' }}
        run: |
          echo "${{ secrets.CRX_PRIVATE_KEY }}" > private.pem
          npm install -g crx3
          npx crx3 pack dist -o ai-chat-exporter.crx -p private.pem
          rm private.pem

      - name: Sign XPI (Firefox)
        if: ${{ secrets.MOZILLA_API_KEY != '' && secrets.MOZILLA_API_SECRET != '' }}
        run: |
          npm install -g web-ext
          # Use channel=unlisted for self-distribution if preferred, or listed for AMO.
          # Defaulting to unlisted for self-hosted releases (no AMO review required).
          web-ext sign --source-dir dist --channel=unlisted --api-key=${{ secrets.MOZILLA_API_KEY }} --api-secret=${{ secrets.MOZILLA_API_SECRET }} --artifacts-dir web-ext-artifacts
          mv web-ext-artifacts/*.xpi ai-chat-exporter.xpi || true

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ai-chat-exporter.zip
            ai-chat-exporter.crx
            ai-chat-exporter.xpi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
